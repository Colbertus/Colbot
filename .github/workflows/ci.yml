name: Colbot Discord Bot Linting

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install isort
          pip install black
          pip install pylint
      - name: Sorting dependencies with isort
        run: |
          isort --check-only --diff $(git ls-files '*.py')
      - name: Checking code style with black
        run: |
          black --check --diff $(git ls-files '*.py')
      - name: Checking code style with pylint
        run: |
          pylint --disable=R0903,W0221 $(git ls-files '*.py')