name: Colbot Discord Bot Linting

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv sync --dev
      - name: Sorting dependencies with isort
        run: |
          pipenv run isort --check-only --diff $(git ls-files '*.py')
      - name: Checking code style with black
        run: |
          pipenv run black --check --diff $(git ls-files '*.py')
      - name: Checking code style with pylint
        run: |
          pipenv run pylint --disable=R0903,W0221,R0914,R0401 $(git ls-files '*.py')
      - name: Static Analysis with mypy
        run: |
          pipenv run mypy --strict $(git ls-files '*.py')